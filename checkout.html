<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Lola Strand & Style</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f0eb;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">Lola Strand & Style</a>
    <a href="cart.html">← Back to Cart</a>
</header>

<div class="container">

    <h1>Checkout</h1>

    <div class="box">

        <h2>Customer Information</h2>

        <form>

            <label>Full Name</label>

            <input
                type="text"
                placeholder="Enter your full name"
                required
            >

            <label>Phone Number</label>

            <input
                type="tel"
                placeholder="08012345678"
                required
            >

            <label>Delivery Address</label>

            <textarea
                placeholder="Enter your delivery address"
                required
            ></textarea>

            <label>Order Notes</label>

            <textarea
                placeholder="Optional"
            ></textarea>

            <button type="submit">
                Place Order
            </button>

        </form>

    </div>

</div>

    "https://rvqzleoqrorzjtvzwptj.supabase.co";

    window.supabase.createClient(

</script>

</body>
</html>
