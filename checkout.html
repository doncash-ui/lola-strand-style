<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Lola Strand & Style</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f0eb;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">Lola Strand & Style</a>
    <a href="cart.html">← Back to Cart</a>
</header>

<div class="container">

    <h1>Checkout</h1>

    <div class="box">

        <h2>Customer Information</h2>

        <form id="checkout-form">

    <label>Full Name</label>

    <input
        id="customer-name"
        type="text"
        placeholder="Enter your full name"
        required
    >

    <label>Phone Number</label>

    <input
        id="customer-phone"
        type="tel"
        placeholder="08012345678"
        required
    >

    <label>Delivery Address</label>

    <textarea
        id="customer-address"
        placeholder="Enter your delivery address"
        required
    ></textarea>

    <label>Order Notes</label>

    <textarea
        id="order-notes"
        placeholder="Optional"
    ></textarea>

    <button type="submit">
        Place Order
    </button>

</form>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://rvqzleoqrorzjtvzwptj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YV-2sm31LyMt_CPEk3DCBg_Ny0R6-2V";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
    const cart =
    JSON.parse(
        localStorage.getItem("lolaCart") || "[]"
    );

const checkoutForm =
    document.getElementById("checkout-form");

checkoutForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        if (cart.length === 0) {
            alert("Your cart is empty.");
            return;
        }

        const customerName =
            document.getElementById(
                "customer-name"
            ).value.trim();

        const customerPhone =
            document.getElementById(
                "customer-phone"
            ).value.trim();

        const customerAddress =
            document.getElementById(
                "customer-address"
            ).value.trim();

        const orderNotes =
            document.getElementById(
                "order-notes"
            ).value.trim();

        let totalAmount = 0;

        const items = cart.map(item => {

            const itemTotal =
                Number(item.price) *
                Number(item.quantity);

            totalAmount += itemTotal;

            return `${item.name} × ${item.quantity} — ₦${itemTotal.toLocaleString()}`;
        }).join("\n");

        const finalItems =
            orderNotes
                ? items + "\nNotes: " + orderNotes
                : items;

        const { data, error } =
            await supabaseClient
                .from("orders")
                .insert([
                    {
                        customer_name: customerName,
                        customer_phone: customerPhone,
                        customer_address: customerAddress,
                        items: finalItems,
                        total_amount: totalAmount,
                        status: "Pending"
                    }
                ])
                .select();

        if (error) {

            console.error(
                "Order error:",
                error
            );

            alert(
                "Order could not be placed: " +
                error.message
            );

            return;
        }

        console.log(
            "Order created:",
            data
        );

        localStorage.removeItem("lolaCart");

        alert(
            "Order placed successfully!"
        );

        window.location.href =
            "index.html";

    }
);

</script>

</body>
</html>
