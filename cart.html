<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - Lola Strand & Style</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f0eb;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .cart-item {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;

            display: flex;
            align-items: center;
            gap: 18px;
        }

        .cart-item img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 8px;
            background: #f5f0eb;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 8px;
        }

        .price {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button {
            width: 34px;
            height: 34px;
            border: none;
            background: #111;
            color: white;
            border-radius: 6px;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity-number {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        .remove {
            background: #111;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .summary {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .checkout {
            display: block;
            width: 100%;
            background: #111;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {

            .cart-item {
                align-items: flex-start;
            }

            .cart-item img {
                width: 70px;
                height: 70px;
            }

            .remove {
                padding: 8px;
            }

        }

    </style>

</head>

<body>

<header>

    <a href="index.html">
        Lola Strand & Style
    </a>

    <a href="index.html">
        ← Continue Shopping
    </a>

</header>


<div class="container">

    <h1>🛒 Your Cart</h1>

    <div id="cart-container">
        Loading cart...
    </div>

</div>


<script>

function getCart() {

    return JSON.parse(
        localStorage.getItem("lolaCart") || "[]"
    );

}


function saveCart(cart) {

    localStorage.setItem(
        "lolaCart",
        JSON.stringify(cart)
    );

}


function displayCart() {

    const container =
        document.getElementById("cart-container");

    const cart = getCart();

    if (!Array.isArray(cart) || cart.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <h2>
                    Your cart is empty
                </h2>

                <p style="margin-top:10px;">
                    Add some products to your cart.
                </p>

            </div>

        `;

        return;
    }


    let total = 0;

    let itemsHTML = "";


    cart.forEach((item, index) => {

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.quantity) || 1;

        const itemTotal =
            price * quantity;

        total += itemTotal;


        itemsHTML += `

            <div class="cart-item">

                <img
                    src="${item.image_url || ""}"
                    alt="${item.name || "Product"}"
                >


                <div class="item-info">

                    <h3>
                        ${item.name || "Product"}
                    </h3>


                    <div class="price">

                        ₦${price.toLocaleString()}

                    </div>


                    <div class="quantity-controls">

                        <button
                            type="button"
                            onclick="changeQuantity(${index}, -1)"
                        >
                            −
                        </button>


                        <span class="quantity-number">
                            ${quantity}
                        </span>


                        <button
                            type="button"
                            onclick="changeQuantity(${index}, 1)"
                        >
                            +
                        </button>

                    </div>

                </div>


                <button
                    type="button"
                    class="remove"
                    onclick="removeItem(${index})"
                >
                    Remove
                </button>

            </div>

        `;

    });


    container.innerHTML = `

        ${itemsHTML}


        <div class="summary">

            <div class="total">

                Total:
                ₦${total.toLocaleString()}

            </div>


            <a
                href="checkout.html"
                class="checkout"
            >
                Proceed to Checkout
            </a>

        </div>

    `;

}


function changeQuantity(index, change) {

    const cart = getCart();


    if (!cart[index]) {
        return;
    }


    let quantity =
        Number(cart[index].quantity) || 1;


    quantity += change;


    if (quantity <= 0) {

        cart.splice(index, 1);

    } else {

        cart[index].quantity =
            quantity;

    }


    saveCart(cart);

    displayCart();

}


function removeItem(index) {

    const cart = getCart();


    if (!cart[index]) {
        return;
    }


    cart.splice(index, 1);


    saveCart(cart);

    displayCart();

}


displayCart();

</script>

</body>
</html>
