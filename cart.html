<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - Lola Strand & Style</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f0eb;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .cart-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-item img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 8px;
            background: #f5f0eb;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            margin-bottom: 8px;
        }

        .price {
            font-weight: bold;
        }

        .quantity {
            margin-top: 8px;
        }

        .remove {
            background: #111;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .summary {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .checkout {
            display: block;
            width: 100%;
            background: #111;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .error {
            background: white;
            padding: 25px;
            border-radius: 12px;
            color: red;
        }

        @media (max-width: 600px) {
            .cart-item {
                align-items: flex-start;
            }

            .cart-item img {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">Lola Strand & Style</a>
    <a href="index.html">← Continue Shopping</a>
</header>

<div class="container">

    <h1>🛒 Your Cart</h1>

    <div id="cart-container">
        Loading cart...
    </div>

</div>

<script>

try {

    const container =
        document.getElementById("cart-container");

    const savedCart =
        localStorage.getItem("lolaCart");

    console.log("Saved cart:", savedCart);

    const cart =
        JSON.parse(savedCart || "[]");

    if (!Array.isArray(cart) || cart.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h2>Your cart is empty</h2>
                <p style="margin-top:10px;">
                    Add some products to your cart.
                </p>
            </div>
        `;

    } else {

        let total = 0;
        let itemsHTML = "";

        cart.forEach((item, index) => {

            const itemTotal =
                Number(item.price) *
                Number(item.quantity);

            total += itemTotal;

            itemsHTML += `

                <div class="cart-item">

                    <img
                        src="${item.image_url || ""}"
                        alt="${item.name || "Product"}"
                    >

                    <div class="item-info">

                        <h3>
                            ${item.name || "Product"}
                        </h3>

                        <div class="price">
                            ₦${Number(item.price).toLocaleString()}
                        </div>

                        <div class="quantity">
                            Quantity: ${item.quantity}
                        </div>

                    </div>

                    <button
                        class="remove"
                        onclick="removeItem(${index})"
                    >
                        Remove
                    </button>

                </div>

            `;
        });

        container.innerHTML = `

            ${itemsHTML}

            <div class="summary">

                <div class="total">
                    Total:
                    ₦${total.toLocaleString()}
                </div>

                <a
    href="checkout.html"
    class="checkout"
>
    Proceed to Checkout
</a>
            </div>
        `;
    }

} catch (error) {

    console.error("Cart error:", error);

    document.getElementById("cart-container").innerHTML = `
        <div class="error">
            Cart error: ${error.message}
        </div>
    `;
}


function removeItem(index) {

    let cart =
        JSON.parse(
            localStorage.getItem("lolaCart") || "[]"
        );

    cart.splice(index, 1);

    localStorage.setItem(
        "lolaCart",
        JSON.stringify(cart)
    );

    location.reload();
}


function checkout() {

    alert("Checkout page coming next!");

}

</script>

</body>
</html>
