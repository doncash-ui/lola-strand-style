<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product - Lola Strand & Style</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f0eb;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .product {
            background: white;
            border-radius: 15px;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .product img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 12px;
            background: #f5f0eb;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .description {
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status {
            margin-bottom: 20px;
            font-weight: bold;
        }

        button {
            background: #111;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        @media (max-width: 700px) {
            .product {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">Lola Strand & Style</a>
    <a href="index.html">← Back to Shop</a>
</header>

<div class="container">
    <div id="product-container">
        Loading product...
    </div>
</div>

<script>

const SUPABASE_URL =
    "https://rvqzleoqrorzjtvzwptj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YV-2sm31LyMt_CPEk3DCBg_Ny0R6-2V";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

async function loadProduct() {

    const container =
        document.getElementById("product-container");

    const params =
        new URLSearchParams(window.location.search);

    const productId =
        params.get("id");

    console.log("Product ID:", productId);

    if (!productId) {
        container.innerHTML =
            "<p>Product ID is missing.</p>";
        return;
    }

    try {

        const result =
            await supabaseClient
                .from("product")
                .select("*")
                .eq("id", productId)
                .single();

        console.log("Supabase result:", result);

        if (result.error) {

            container.innerHTML =
                "<p>Unable to load product.</p>" +
                "<p style='color:red; margin-top:10px;'>" +
                result.error.message +
                "</p>";

            return;
        }

        const product =
            result.data;

        if (!product) {

            container.innerHTML =
                "<p>Product not found.</p>";

            return;
        }

        container.innerHTML = `

            <div class="product">

                <img
                    src="${product.image_url || ""}"
                    alt="${product.name}"
                >

                <div class="product-info">

                    <h1>${product.name}</h1>

                    <div class="price">
                        ₦${Number(product.price).toLocaleString()}
                    </div>

                    <div class="status">
                        ${product.in_stock
                            ? "In Stock"
                            : "Out of Stock"}
                    </div>

                    <p class="description">
                        ${product.description || "No description available."}
                    </p>

                    ${
                        product.in_stock
                        ? `<button onclick="addToCart()">
                            🛒 Add to Cart
                           </button>`
                        : `<button disabled>
                            Out of Stock
                           </button>`
                    }

                </div>

            </div>

        `;

        window.currentProduct =
            product;

    } catch (error) {

        console.error(error);

        container.innerHTML =
            "<p>Something went wrong.</p>" +
            "<p style='color:red;'>" +
            error.message +
            "</p>";
    }
}

function addToCart() {

    const product =
        window.currentProduct;

    let cart =
        JSON.parse(
            localStorage.getItem("lolaCart") || "[]"
        );

    const existing =
        cart.find(
            item => item.id === product.id
        );

    if (existing) {

        existing.quantity += 1;

    } else {

        cart.push({
            id: product.id,
            name: product.name,
            price: product.price,
            image_url: product.image_url,
            quantity: 1
        });

    }

    localStorage.setItem(
        "lolaCart",
        JSON.stringify(cart)
    );

    alert("Product added to cart!");

}

loadProduct();

</script>

</body>
</html>
