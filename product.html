<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product - Lola Strand & Style</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f0eb;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .product {
            background: white;
            border-radius: 15px;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .product img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 12px;
            background: #f5f0eb;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .description {
            line-height: 1.6;
            margin-bottom: 25px;
        }

        button {
            background: #111;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.85;
        }

        .status {
            margin-bottom: 15px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .product {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html">Lola Strand & Style</a>
    <a href="index.html">← Back to Shop</a>
</header>

<div class="container">

    <div id="product-container">
        Loading product...
    </div>

</div>

<script>

const SUPABASE_URL =
    "https://rvqzleoqrorzjtvzwptj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YV-2sm31LyMt_CPEk3DCBg_Ny0R6-2V";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const params = new URLSearchParams(window.location.search);

const productId = params.get("id");

async function loadProduct() {

    const container =
        document.getElementById("product-container");

    if (!productId) {
        container.innerHTML =
            "<p>Product not found.</p>";
        return;
    }

    const { data, error } =
        await supabaseClient
            .from("product")
            .select("*")
            .eq("id", productId)
            .single();

    if (error) {
    console.error("Product error:", error);

    container.innerHTML =
        "<p>Unable to load product.</p>" +
        "<p style='color:red; margin-top:10px;'>" +
        error.message +
        "</p>";

    return;
}
